# 施工图常见短代号图例映射表
# 用于辅助LLM正确解读DXF中的短标注代号，防止符号误读幻觉

symbols:
  # --- 门类 ---
  FM: "防火门（数字后缀为宽x高尺寸编码，如FM 1222=1200x2200防火门）"
  FM甲: "甲级防火门（耐火极限≥1.5h）"
  FM乙: "乙级防火门（耐火极限≥1.0h）"
  FM丙: "丙级防火门（耐火极限≥0.5h）"
  M: "普通木门"
  QD:
    meaning: "强电间/强电井（Electrical Distribution Room，配电用房）"
    not_meaning: "绝对不是门的代号、不是防火卷帘、不是前室"
  QDJ: "强电井"
  RD: "弱电间"
  RDJ: "弱电井"

  # --- 井道类 ---
  SJ: "水管井/竖井"
  PY: "排烟井"
  PF: "排风井"
  SF: "送风井"
  DT: "电梯（DT 2#等是电梯编号）"
  HT: "货梯"

  # --- 房间/空间类 ---
  PI:
    meaning: "Principal Investigator（学术带头人）办公室，常见于科研/实验建筑"
    not_meaning: "不是喷淋系统(PI=Principal Investigator)"
  QD_room: "强电间"

  # --- 消防类 ---
  XF: "消防"
  XHS: "消火栓"
  PL: "喷淋"

  # --- 结构类 ---
  KL: "框架梁"
  LL: "连梁"
  CL: "次梁"
  C: "混凝土柱"
  KZ: "框架柱"

  # --- 标高/尺寸 ---
  BG: "标高"
  H: "高度"

notes: |
  审查图纸时请注意：
  1. 短代号的含义必须对照此表，不可凭猜测解读
  2. "QD 38m 配套用房"中QD=强电间，38m=38平方米面积，不是宽度
  3. "PI 办公室"中PI=学术带头人，不是喷淋/消防相关
  4. "FM 1222"的后四位数字(1222)=门洞尺寸编码(1200mm宽x2200mm高)，不是耐火等级
  5. 防火门耐火等级(甲/乙/丙)通常在防火门表中标注，平面图中不重复标注
  6. 喷淋/消火栓/排烟系统详细标注一般在系统图或设计说明中，平面图仅用图例符号表示
