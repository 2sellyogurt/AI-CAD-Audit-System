discipline: landscape
description: 景观专业检查点 - 5个高频检查项

checkpoints:

  - id: LS-001
    name: 绿化用地面积标注检查
    description: 检查景观总平面图中绿化用地面积是否标注明确
    discipline: landscape
    check_type: text_presence
    route: text
    severity: B
    priority: 78
    standard_code: GB50420-2007(2016)
    standard_clause: "4.1.3"
    clause_text: "绿化用地面积应满足规划确定的绿地率指标要求，并在总平面图中标注绿化区域及面积"
    target_object: ["绿化用地", "绿地面积"]
    target_property: "应标注绿化用地面积"
    keywords: ["绿化", "绿地", "绿地率", "绿化面积"]
    suggestion_template: "在总平面图中补充标注各绿化区域面积及总体绿地率指标"
    applicable_building_types: ["全部"]

  - id: LS-002
    name: 道路转弯半径检查
    description: 检查景观道路转弯半径是否满足最小通行要求
    discipline: landscape
    check_type: dimension_min
    route: text
    severity: B
    priority: 74
    standard_code: CJJ37-2012(2016)
    standard_clause: "6.3.2"
    clause_text: "道路路缘石转弯半径应根据道路等级和车辆类型确定，最小转弯半径不应小于6.0m"
    target_object: ["道路转弯", "路缘石转弯"]
    target_property: "转弯半径"
    operator: ">="
    limit_value: 6000
    unit: mm
    keywords: ["转弯半径", "道路", "路缘石", "转弯"]
    suggestion_template: "道路转弯半径不足6000mm，请增大转弯半径满足消防车通行要求"
    applicable_building_types: ["全部"]

  - id: LS-003
    name: 树池尺寸标注检查
    description: 检查景观树池的平面尺寸是否满足最小要求
    discipline: landscape
    check_type: dimension_min
    route: text
    severity: C
    priority: 62
    standard_code: CJJ/T85-2017
    standard_clause: "4.3.2"
    clause_text: "行道树树池尺寸不应小于1.20m×1.20m，树池深度不应小于1.0m"
    target_object: ["树池", "行道树树池"]
    target_property: "树池最小尺寸"
    operator: ">="
    limit_value: 1200
    unit: mm
    keywords: ["树池", "行道树", "树穴", "种植池"]
    suggestion_template: "树池尺寸不足1200mm×1200mm，请增大树池尺寸满足树木生长要求"
    applicable_building_types: ["全部"]

  - id: LS-004
    name: 室外台阶坡度标注检查
    description: 检查室外台阶的坡度及踏步尺寸是否标注完整
    discipline: landscape
    check_type: text_presence
    route: text
    severity: B
    priority: 70
    standard_code: GB50352-2019
    standard_clause: "6.7.10"
    clause_text: "室外台阶踏步宽度不宜小于0.30m，踏步高度不宜大于0.15m，且踏步高度应均匀一致"
    target_object: ["室外台阶", "台阶"]
    target_property: "应标注台阶踏步尺寸"
    keywords: ["台阶", "踏步", "室外台阶", "踏步宽度", "踏步高度"]
    suggestion_template: "补充标注室外台阶的踏步宽度和高度尺寸，确保符合规范要求"
    applicable_building_types: ["全部"]

  - id: LS-005
    name: 景观照明配电要求检查
    description: 检查景观照明配电设计的标注是否完整
    discipline: landscape
    check_type: text_presence
    route: text
    severity: C
    priority: 60
    standard_code: GB50034-2013
    standard_clause: "5.4.1"
    clause_text: "室外景观照明配电应单独设置配电箱，并采取防潮、防水、防雷措施"
    target_object: ["景观照明", "室外照明"]
    target_property: "应标注照明配电要求"
    keywords: ["景观照明", "配电", "照明", "室外照明", "防水"]
    suggestion_template: "补充标注景观照明配电箱位置及防水防潮防护等级要求"
    applicable_building_types: ["全部"]
