# ── Layer-Grammar 图层分类规则 ──
layer_rules:
  duct:
    keywords: [airduct, 风管, 送风, 排风, 排烟, 回风, 新风, 空调, vent, exhaust, cuch-air]
  pipe:
    keywords: [pipe, 管, water, 给水, 排水, 消防, 喷淋, 雨水, 污水, 冷, 热, 废水, cuch-pipe]
  beam:
    keywords: [beam, 梁, beam_, 梁_]
    blacklist: [pipe, 管, duct, 风管, cable, 标注, dim, text]
  column:
    keywords: [column, 柱, col_, 柱_]
  wall:
    keywords: [wall, 墙, wall_, 墙_]

# ── 冲突检测：类型组合映射 ──
conflict_rules:
  beam_duct:
    type: beam_duct_overlap
    severity: B
    std: "GB50010-2010 9.2.14（梁开洞限制）；GB51251-2017 4.4.8（排烟风管耐火要求）"
    risk: "梁与风管平面叠合，若需穿梁则破坏结构承载力。需结构专业确认梁预留洞位置及补强方案，或调整风管路由"
    overlap_threshold: 300
  beam_pipe:
    type: beam_pipe_overlap
    severity: B
    std: "GB50010-2010 9.2.14（梁开洞限制）"
    risk: "管线与梁平面叠合，需确认标高关系，避免管线穿梁"
    overlap_threshold: 200
  column_pipe:
    type: column_pipe_conflict
    severity: B
    std: "GB50010-2010 6.4.12（柱开洞限制）"
    risk: "管线穿越柱子将破坏结构，需重新规划管线路径或柱预留套管"
    overlap_threshold: 100
  pipe_crossing:
    type: pipe_crossing
    severity: B
    std: "GB50015-2019 4.4.2（排水管坡度）；GB50242-2002 3.3.3（管线综合排布）"
    risk: "风管与给排水管交叉需协调标高，风管优先在上方，排水管需保证坡度"
    overlap_threshold: 200
  duct_wall:
    type: duct_through_wall
    severity: B
    std: "GB50016-2014 6.3.5（防火封堵）；GB50243-2016 6.2.7（风管穿墙要求）"
    risk: "风管穿墙需预留套管并做防火封堵，未预留将导致后期开洞破坏墙体"
    overlap_threshold: 200
  egress_width:
    type: egress_width
    severity: B
    std: "GB50016-2014 5.5.18（疏散走道净宽）"
    risk: "疏散走道净宽不足，影响人员疏散时间，需复核消防疏散宽度要求"
    gap_min: 1100
    gap_max: 4400
    wall_min_length: 2000
    parallelism_threshold: 300

# ── 运行时参数 ──
runtime:
  max_file_size_mb: 150
  spatial_tolerance: 500
  cache_dir: .dxf_cache
  floor_assignment_distance: 50000
  elevation_tag_distance: 10000
  dedup_bucket_size: 3000
  dedup_grid_size: 500